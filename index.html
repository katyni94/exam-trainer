<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренер</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f1f5f9;color:#0f172a;transition:background .2s,color .2s}
body.dark{background:#0f172a;color:#e2e8f0}
header{background:#1e3a8a;color:#fff;padding:12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:10}
.header-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
header h1{margin:0;font-size:1rem;flex:1;min-width:100px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.btn{background:#3b82f6;color:#fff;border:none;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
nav button:hover,.btn:hover{background:#2563eb}
nav button.active{background:#f59e0b}
.btn.ghost{background:#e2e8f0;color:#0f172a}
.btn.ghost:hover{background:#cbd5e1}
.btn.danger{background:#ef4444}
.btn.ok{background:#10b981}
.btn.warn{background:#f59e0b}
.btn.mini{padding:4px 8px;font-size:.72rem}
.btn.star{background:transparent;color:#f59e0b;font-size:1.1rem;padding:2px 6px;border:1px solid #cbd5e1}
.btn.star.on{background:#fef3c7;border-color:#f59e0b}
select.subject-select{padding:7px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font-size:.9rem;cursor:pointer;font-family:inherit}
select.subject-select option{background:#1e3a8a;color:#fff}
main{padding:14px;max-width:960px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
h2{margin-top:0;font-size:1.15rem}
h3{margin:12px 0 6px;font-size:1rem}
h4{margin:12px 0 6px;font-size:.95rem}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem}
textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px;font-family:inherit;font-size:.92rem}
textarea.tall{min-height:220px;font-family:monospace;font-size:.82rem}
textarea.big{min-height:320px;font-size:.92rem;line-height:1.5}
input[type=text]{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px;font-size:.92rem}
body.dark textarea,body.dark input[type=text]{background:#1e293b;color:#e2e8f0;border-color:#475569}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row .btn{flex:0 0 auto}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin:8px 0}
body.dark .card{background:#1e293b;border-color:#334155}
.card.learned{background:#f0fdf4;border-color:#86efac}
body.dark .card.learned{background:#14532d33;border-color:#166534}
.card.postponed{background:#fef3c7;border-color:#f59e0b}
body.dark .card.postponed{background:#78350f33;border-color:#b45309}
.card .meta{font-size:.75rem;color:#64748b;margin:4px 0}
.card button{padding:5px 10px;margin-right:5px;margin-top:6px;font-size:.78rem}
.group-block{margin:22px 0 8px;border-bottom:2px solid #cbd5e1;padding-bottom:6px}
body.dark .group-block{border-color:#334155}
.group-header{font-size:.75rem;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.group-title{font-weight:700;font-size:1rem;color:#1e3a8a;margin-top:2px}
body.dark .group-title{color:#93c5fd}
.group-meta{font-size:.78rem;color:#64748b;margin-top:4px}
.study-box{background:#fff;border-radius:10px;padding:18px}
body.dark .study-box{background:#1e293b}
.answer{background:#f8fafc;border-left:4px solid #3b82f6;padding:12px;border-radius:6px;margin:10px 0;white-space:pre-wrap;font-size:.92rem}
body.dark .answer{background:#0f172a}
.answer.plan{border-color:#10b981}
.rating{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rating button{padding:8px 14px;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:.85rem}
.rating button:nth-child(1){background:#ef4444}
.rating button:nth-child(2){background:#f59e0b}
.rating button:nth-child(3){background:#3b82f6}
.rating button:nth-child(4){background:#10b981}
.preview{background:#fff;border-left:4px solid #3b82f6;padding:10px;margin:8px 0;border-radius:6px}
body.dark .preview{background:#1e293b}
.preview .q{font-weight:600;font-size:.92rem}
.preview .a{font-size:.82rem;color:#475569;white-space:pre-wrap;max-height:140px;overflow:auto;margin-top:5px}
body.dark .preview .a{color:#94a3b8}
.hint{font-size:.82rem;color:#64748b;margin-top:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;background:#e2e8f0;color:#475569;margin-left:5px}
body.dark .pill{background:#334155;color:#cbd5e1}
.card-img{max-width:100%;border-radius:6px;margin:10px 0;display:block}
.img-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;background:#dbeafe;color:#1e40af;margin-left:5px}
.big-pbar{background:#e2e8f0;border-radius:8px;height:22px;overflow:hidden;margin:10px 0;position:relative}
body.dark .big-pbar{background:#334155}
.big-pbar>div{background:linear-gradient(90deg,#10b981,#22c55e);height:100%;transition:.4s}
.big-pbar>span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;color:#0f172a}
body.dark .big-pbar>span{color:#e2e8f0}
.sum-item{display:flex;gap:10px;align-items:center;padding:10px;background:#fff;border-radius:8px;margin:6px 0;border-left:4px solid #e2e8f0}
body.dark .sum-item{background:#1e293b;border-color:#334155}
.sum-item.full{border-color:#10b981;background:#f0fdf4}
body.dark .sum-item.full{background:#14532d33}
.sum-item.part{border-color:#f59e0b;background:#fffbeb}
body.dark .sum-item.part{background:#78350f33}
.sum-num{font-weight:700;color:#1e3a8a;min-width:28px;font-size:.95rem}
body.dark .sum-num{color:#93c5fd}
.sum-body{flex:1}
.sum-q{font-size:.88rem;margin:0}
.sum-meta{font-size:.72rem;color:#64748b;margin-top:3px}
.sum-status{font-size:1.4rem;min-width:32px;text-align:center}
.topic-part{background:#f0fdf4;border-left:3px solid #10b981;border-radius:6px;padding:10px;margin:8px 0}
body.dark .topic-part{background:#14532d33}
.topic-part .pt{font-weight:600;font-size:.88rem;margin-bottom:4px}
.topic-answer{background:#f8fafc;border-radius:6px;padding:10px;margin:8px 0;font-size:.88rem;white-space:pre-wrap}
body.dark .topic-answer{background:#0f172a}
#dark-btn{background:transparent;border:1px solid rgba(255,255,255,.4);padding:6px 10px;font-size:1rem}
.img-row{display:flex;gap:6px;margin-top:6px;align-items:center}
.img-row input{flex:1}
.img-row button{flex:0 0 auto;padding:6px 10px}
.q-row{display:flex;gap:6px;margin-top:6px;align-items:center}
.q-row input.q-num{width:60px;flex:0 0 auto;text-align:center}
.q-row input.q-title{flex:1}
.q-row button{flex:0 0 auto;padding:6px 10px}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <h1>Тренер</h1>
    <select id="subject-select" class="subject-select"></select>
    <button class="btn ghost mini" id="subject-add" title="Новый предмет" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)">+</button>
    <button class="btn ghost mini" id="subject-manage" title="Управление" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)">⚙</button>
    <button id="dark-btn" title="Тёмная тема">🌙</button>
  </div>
  <div class="header-row">
    <nav>
      <button data-tab="import" class="active">Импорт</button>
      <button data-tab="topics">Темы</button>
      <button data-tab="study">Учёба</button>
      <button data-tab="summary">Сводка</button>
    </nav>
  </div>
</header>
<main>
<section id="import" class="tab active">
  <h2>Импорт</h2>
  <p class="hint">Формат: «Тема 1.1. Название» … «План ответа:» … список. Картинки — строками «Картинка: https://...». Если вопрос с таким номером ещё не создан — приложение предложит создать его автоматически.</p>
  <label>Текст</label>
  <textarea id="import-text" class="tall"></textarea>
  <div class="row">
    <button class="btn" id="parse-btn">Разобрать</button>
    <button class="btn ghost" id="clear-import">Очистить</button>
  </div>
  <div id="preview-block" style="display:none;margin-top:16px">
    <h3>Предпросмотр <span class="pill" id="preview-count">0</span></h3>
    <div id="preview-list"></div>
    <button class="btn ok" id="add-all">Добавить все</button>
  </div>
</section>

<section id="topics" class="tab">
  <h2>Темы <span class="pill" id="topics-count">0</span> <span class="pill" id="learned-count" style="background:#d1fae5;color:#065f46">Изучено: 0</span></h2>
  <div class="row">
    <input type="text" id="search" placeholder="Поиск...">
    <button class="btn" id="question-add">+ Вопрос</button>
    <button class="btn ghost" id="questions-manage">⚙ Вопросы</button>
    <button class="btn ghost" id="expand-all">Развернуть</button>
    <button class="btn ghost" id="collapse-all">Свернуть</button>
    <button class="btn ghost" id="print-btn">🖨 PDF</button>
    <button class="btn ghost" id="export-btn">Экспорт</button>
    <label class="btn ghost" style="margin:0;cursor:pointer;text-align:center">
      Импорт<input type="file" id="import-json" accept=".json" style="display:none">
    </label>
    <button class="btn danger" id="clear-all">Удалить всё</button>
  </div>
  <div id="topics-list"></div>
</section>

<section id="study" class="tab">
  <h2>Учёба</h2>
  <div id="study-area" class="study-box"></div>
</section>

<section id="summary" class="tab">
  <h2>Сводка по вопросам</h2>
  <div id="overall-progress"></div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn ghost" id="filter-all">Все</button>
    <button class="btn ghost" id="filter-learned">Изученные</button>
    <button class="btn ghost" id="filter-left">Осталось</button>
  </div>
  <div id="summary-list"></div>
</section>
</main>

<script>
/* ============ ПРЕДМЕТЫ ============ */
var DEFAULT_SUBJECT = "Строительство транспортных сооружений";

// Первоначальные вопросы для старого предмета (для миграции)
var LEGACY_QUESTIONS = {
  "1":"Выбор ведущей машины при возведении насыпи","2":"Строительство покрытий из холодной асфальтобетонной смеси","3":"Контроль качества уплотнения грунтов","4":"Возведение насыпей на заболоченном участке","5":"Определение параметров потока при возведении земляного полотна","6":"Устройство оснований и покрытий из щебня и грунтов, укреплённых органическими вяжущими (смешение на дороге)","7":"Теоретические основы уплотнения грунтов","8":"Уход за цементогрунтом","9":"Технология строительства цементобетонных покрытий","13":"Оценка климатической характеристики района строительства","14":"Приемочный контроль при возведении земляного полотна","15":"Устройство оснований и покрытий способом пропитки и полупропитки","16":"Рекультивация сосредоточенного резерва","18":"Подготовка поверхности земляного полотна к строительству дорожной одежды","19":"Технология строительства покрытий из горячих асфальтобетонных смесей","20":"Технология строительства сборных покрытий","21":"Технология строительства основания из рядового щебня","22":"Определение количества проходов катка при уплотнении грунтов","25":"Возведение насыпей при пониженных температурах","26":"Устройство оснований и покрытий из грунтов, укреплённых неорганическими вяжущими (смешение на дороге)","28":"Производственный контроль ведения работ. Виды контроля","29":"Влияние влажности грунта на его плотность","30":"Устройство оснований из щебня и грунтов, обработанных органическими вяжущими в смесительной установке","32":"Возведение земляного полотна отрядом с ведущим экскаватором","33":"Технология строительства основания из фракционного щебня","34":"Классификация дорожно-строительных работ, типы поперечных профилей земляного полотна","35":"Устройство слоёв износа","36":"Возведение насыпей скреперами","37":"Классификация асфальтобетонов и асфальтобетонных смесей","40":"Устройство температурных швов в цементобетонном покрытии","43":"Строительство фундамента водопропускных труб","44":"Устройство оснований из материалов и грунтов, обработанных неорганическим вяжущим в смесительной установке","46":"Подготовка и порядок разработки сосредоточенного резерва","47":"Технология строительства дренирующих слоёв дорожной одежды","48":"Устройство оснований по способу заклинки","49":"Функции и регламент операционного контроля","53":"Технология строительства покрытий из щебёночно-мастичных асфальтобетонных смесей"
};

// subjects: { "Название": { questions: {...}, cards: [...] } }
var subjects = JSON.parse(localStorage.getItem("subjects_v2") || "null");
var currentSubject = localStorage.getItem("currentSubject_v2") || DEFAULT_SUBJECT;

// Миграция со старого формата (subjects_v1 / cards)
if(!subjects){
  var oldSubjects = JSON.parse(localStorage.getItem("subjects") || "null");
  var oldCards = JSON.parse(localStorage.getItem("cards") || "[]");
  subjects = {};

  if(oldSubjects){
    // Из v1: subjects = { "Название": [карточки] }
    Object.keys(oldSubjects).forEach(function(name){
      subjects[name] = {
        questions: (name === DEFAULT_SUBJECT) ? JSON.parse(JSON.stringify(LEGACY_QUESTIONS)) : {},
        cards: oldSubjects[name] || []
      };
    });
  } else if(oldCards.length){
    // Совсем старый формат: просто cards
    subjects[DEFAULT_SUBJECT] = {
      questions: JSON.parse(JSON.stringify(LEGACY_QUESTIONS)),
      cards: oldCards
    };
  } else {
    subjects[DEFAULT_SUBJECT] = {
      questions: JSON.parse(JSON.stringify(LEGACY_QUESTIONS)),
      cards: []
    };
  }
  localStorage.setItem("subjects_v2", JSON.stringify(subjects));
  localStorage.setItem("currentSubject_v2", currentSubject);
}

if(!subjects[currentSubject]){
  currentSubject = Object.keys(subjects)[0] || DEFAULT_SUBJECT;
  if(!subjects[currentSubject]){
    subjects[currentSubject] = { questions: {}, cards: [] };
  }
}

function getCards(){ return subjects[currentSubject].cards; }
function setCards(arr){ subjects[currentSubject].cards = arr; }
function getQuestions(){ return subjects[currentSubject].questions || {}; }

function save(){
  try{
    localStorage.setItem("subjects_v2", JSON.stringify(subjects));
    localStorage.setItem("currentSubject_v2", currentSubject);
  }catch(e){alert("Хранилище переполнено!");}
}

function switchSubject(name){
  save();
  currentSubject = name;
  localStorage.setItem("currentSubject_v2", currentSubject);
  renderSubjectSelect();
  renderTopics();
  renderStudyStart();
  renderSummary();
}

function renderSubjectSelect(){
  var sel = $("subject-select");
  sel.innerHTML = Object.keys(subjects).map(function(s){
    return '<option value="'+esc(s)+'"'+(s===currentSubject?' selected':'')+'>'+esc(s)+'</option>';
  }).join("");
}

$("subject-select").onchange = function(e){ switchSubject(e.target.value); };

$("subject-add").onclick = function(){
  var name = prompt("Название нового предмета:", "");
  if(!name || !name.trim()) return;
  name = name.trim();
  if(subjects[name]){alert("Такой предмет уже есть."); return;}
  subjects[name] = { questions: {}, cards: [] };
  currentSubject = name;
  save();
  renderSubjectSelect();
  renderTopics(); renderStudyStart(); renderSummary();
  alert("Создан предмет: " + name + "\n\nДобавь вопросы кнопкой «+ Вопрос» во вкладке «Темы», потом импортируй карточки.");
};

$("subject-manage").onclick = function(){
  var action = prompt("Что сделать с предметом «"+currentSubject+"»?\n\n1 — переименовать\n2 — удалить (с подтверждением)\n\nВведи 1 или 2:", "");
  if(action === "1"){
    var newName = prompt("Новое название:", currentSubject);
    if(!newName || !newName.trim() || newName === currentSubject) return;
    newName = newName.trim();
    if(subjects[newName]){alert("Такое название уже занято."); return;}
    subjects[newName] = subjects[currentSubject];
    delete subjects[currentSubject];
    currentSubject = newName;
    save(); renderSubjectSelect();
    alert("Переименовано в: " + newName);
  } else if(action === "2"){
    var names = Object.keys(subjects);
    if(names.length <= 1){alert("Нельзя удалить единственный предмет."); return;}
    if(!confirm("Удалить предмет «"+currentSubject+"» вместе со всеми карточками и вопросами? Необратимо.")) return;
    if(!confirm("Точно удалить? Второе подтверждение.")) return;
    delete subjects[currentSubject];
    currentSubject = Object.keys(subjects)[0];
    save(); renderSubjectSelect();
    renderTopics(); renderStudyStart(); renderSummary();
    alert("Удалено.");
  }
};

/* ============ ОСТАЛЬНОЕ ============ */
var preview = [], studyQueue = [], cur = null;
var studyMode = "cards";
var curTopic = null;
var summaryFilter = "all";
var collapsedGroups = {};

function $(id){return document.getElementById(id);}
function esc(t){var d=document.createElement("div");d.textContent=t||"";return d.innerHTML;}

if(localStorage.getItem("dark")==="1"){ document.body.classList.add("dark"); $("dark-btn").textContent="☀"; }
$("dark-btn").onclick = function(){
  document.body.classList.toggle("dark");
  var isDark = document.body.classList.contains("dark");
  localStorage.setItem("dark", isDark?"1":"0");
  $("dark-btn").textContent = isDark ? "☀" : "🌙";
};

document.querySelectorAll("nav button").forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll("nav button").forEach(function(x){x.classList.remove("active");});
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
    b.classList.add("active");
    $(b.dataset.tab).classList.add("active");
    if(b.dataset.tab==="topics") renderTopics();
    if(b.dataset.tab==="study") renderStudyStart();
    if(b.dataset.tab==="summary") renderSummary();
  };
});

/* ============ ВОПРОСЫ ============ */
$("question-add").onclick = function(){
  var num = prompt("Номер вопроса (например, 1 или 5.1):", "");
  if(!num || !num.trim()) return;
  num = num.trim();
  var qs = getQuestions();
  if(qs[num]){alert("Вопрос с таким номером уже есть."); return;}
  var title = prompt("Заголовок вопроса:", "");
  if(!title || !title.trim()) return;
  qs[num] = title.trim();
  save(); renderTopics(); renderSummary();
};

$("questions-manage").onclick = function(){
  var qs = getQuestions();
  var nums = Object.keys(qs).sort(function(a,b){
    var na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });
  if(!nums.length){
    alert("В этом предмете пока нет вопросов.\n\nНажми «+ Вопрос», чтобы добавить.");
    return;
  }
  var old = document.getElementById("modal-questions"); if(old) old.remove();
  var modal = document.createElement("div");
  modal.id = "modal-questions";
  modal.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.9);z-index:9999;overflow-y:auto;padding:70px 14px 30px 14px;-webkit-overflow-scrolling:touch";
  var rows = nums.map(function(n){
    return '<div class="q-row" data-num="'+esc(n)+'"><input class="q-num" value="'+esc(n)+'" readonly><input class="q-title" value="'+esc(qs[n])+'"><button class="btn danger" type="button" onclick="this.parentNode.remove()">✕</button></div>';
  }).join('');
  modal.innerHTML =
    '<button id="q-close" style="position:fixed;top:12px;right:12px;background:#ef4444;color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:1.5rem;cursor:pointer;z-index:10000;box-shadow:0 3px 10px rgba(0,0,0,.4);line-height:1;padding:0">✕</button>'+
    '<div style="background:#fff;border-radius:12px;padding:18px;max-width:720px;margin:0 auto;color:#0f172a">'+
      '<h3 style="margin:0 0 10px">Вопросы предмета: '+esc(currentSubject)+'</h3>'+
      '<p class="hint" style="margin:0 0 10px">Редактируй заголовки. Удаляй ненужные. Сохрани изменения внизу.</p>'+
      '<div id="q-list">'+rows+'</div>'+
      '<button class="btn ghost mini" id="q-add" type="button" style="margin-top:10px">+ Добавить вопрос</button>'+
      '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'+

/* ============ ПАРСЕР ============ */
function parseText(text){
  var out = [];
  var re = /^Тема\s+([\d.]+)[.:]?\s*(.+)$/gmi;
  var matches = [], m;
  while((m = re.exec(text)) !== null) matches.push({index:m.index, num:m[1], question:m[2].trim()});
  if(matches.length === 0){
    out.push({num:"", group:"", question:"Без названия", answer:text, plan:autoPlan(text), images:[]});
    return out;
  }
  for(var i=0;i<matches.length;i++){
    var start = matches[i].index;
    var end = (i+1 < matches.length) ? matches[i+1].index : text.length;
    var block = text.substring(start, end);
    var plan = "";
    var pm = block.match(/План ответа\s*:?\s*\n([\s\S]*?)(?=\n(?:Мнемоника|Пример|Викторина|Картинка|Тема \d)|$)/i);
    if(pm){
      plan = pm[1].split("\n").map(function(l){return l.replace(/^[\s\-•]+/,"").trim();}).filter(function(l){return l.length>3;}).map(function(p,i2){return /^\d/.test(p)?p:(i2+1)+". "+p;}).join("\n");
    }
    if(!plan) plan = autoPlan(block);
    var group = matches[i].num.split(".")[0];
    var images = [];
    var imgRe = /(?:Картинка|Изображение)\s*:?\s*(\S+)/gi;
    var im;
    while((im = imgRe.exec(block)) !== null) images.push(im[1].trim());
    var mdRe = /!\[[^\]]*\]\(([^)]+)\)/g;
    while((im = mdRe.exec(block)) !== null) images.push(im[1].trim());
    out.push({num:matches[i].num, group:group, question:matches[i].question, answer:block, plan:plan, images:images});
  }
  return out;
}

function autoPlan(body){
  var lines = body.split("\n").map(function(l){return l.trim();}).filter(function(l){return l.length>15;});
  var points = [];
  for(var i=0;i<lines.length && points.length<7;i++){
    var first = lines[i].split(/[.;!?]/)[0].trim();
    if(first.length>15 && first.length<200) points.push(first);
  }
  if(points.length<3){
    var sents = body.replace(/\n/g," ").split(/(?<=[.!?])\s+/).filter(function(s){return s.length>25;});
    return sents.slice(0,6).map(function(s,i){return (i+1)+". "+s;}).join("\n");
  }
  return points.map(function(p,i){return (i+1)+". "+p;}).join("\n");
}

/* ============ ТЕМЫ ============ */
function renderTopics(){
  var cards = getCards();
  var qs = getQuestions();
  var total = cards.length;
  var learned = cards.filter(function(c){return c.learned;}).length;
  $("topics-count").textContent = total;
  $("learned-count").textContent = "Изучено: " + learned + "/" + total;
  if(!cards.length){$("topics-list").innerHTML = '<p class="hint">Пока нет тем. Создай вопросы и импортируй карточки.</p>'; return;}
  var filter = ($("search").value || "").toLowerCase();
  var filtered = cards.filter(function(c){
    if(!filter) return true;
    var gt = qs[c.group] || "";
    return c.question.toLowerCase().includes(filter) || gt.toLowerCase().includes(filter);
  });
  var groups = {};
  filtered.forEach(function(c){
    var g = c.group || "—";
    if(!groups[g]) groups[g] = [];
    groups[g].push(c);
  });
  var html = "";
  Object.keys(groups).sort(function(a,b){
    var na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  }).forEach(function(g){
    var list = groups[g];
    var gLearned = list.filter(function(c){return c.learned;}).length;
    var gTotal = list.length;
    var isCollapsed = collapsedGroups[g];
    var title = qs[g] || (list[0] && list[0].question) || ("Тема " + g);
    html += '<div class="group-block">';
    html += '<div style="display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap">';
    html += '<div style="flex:1;min-width:200px">';
    html += '<div class="group-header">Вопрос '+g+'</div>';
    html += '<div class="group-title">'+esc(title)+'</div>';
    html += '<div class="group-meta">Подтем: '+gTotal+' · изучено: '+gLearned+'/'+gTotal+'</div>';
    html += '</div>';
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
    html += '<button class="btn ok mini" onclick="showWholeTopic(\''+g+'\')">📖 Вся тема</button>';
    html += '<button class="btn ghost mini" onclick="toggleGroup(\''+g+'\')">'+(isCollapsed?'Развернуть ▾':'Свернуть ▴')+'</button>';
    html += '</div></div></div>';

    if(!isCollapsed){
      html += list.map(function(c){
        var cls = "card";
        if(c.postponedUntil && c.postponedUntil > Date.now()) cls += " postponed";
        else if(c.learned) cls += " learned";
        var imgCount = (c.images && c.images.length) ? c.images.length : 0;
        var imgTag = imgCount ? ' <span class="img-badge">📷 ' + (imgCount > 1 ? imgCount : '') + '</span>' : '';
        var noteTag = c.note ? ' <span class="img-badge" style="background:#fef3c7;color:#92400e">📝</span>' : '';
        var starTag = c.favorite ? ' <span class="img-badge" style="background:#fef3c7;color:#92400e">⭐</span>' : '';
        var postponeTag = (c.postponedUntil && c.postponedUntil > Date.now()) ? ' <span class="img-badge" style="background:#fed7aa;color:#7c2d12">⏰</span>' : '';
        var btnLearn = c.learned
          ? '<button class="btn ghost mini" onclick="toggleLearn('+c.id+')">Снять отметку</button>'
          : '<button class="btn ok mini" onclick="toggleLearn('+c.id+')">✓ Изучено</button>';
        var btnStar = c.favorite
          ? '<button class="btn star on" onclick="toggleFav('+c.id+')" title="Убрать из избранного">⭐</button>'
          : '<button class="btn star" onclick="toggleFav('+c.id+')" title="В избранное">☆</button>';
        return '<div class="'+cls+'" style="margin-left:14px"><strong>'+esc(c.question)+'</strong>'+imgTag+noteTag+starTag+postponeTag+'<div class="meta">'+(c.num?'№'+c.num+' · ':'')+'повторений: '+c.reps+'</div>'+btnStar+btnLearn+'<button class="btn ghost mini" onclick="editNote('+c.id+')">✎ Заметка</button><button class="btn ghost mini" onclick="viewCard('+c.id+')">Показать</button><button class="btn ghost mini" onclick="editCard('+c.id+')">Изменить</button><button class="btn danger mini" onclick="delCard('+c.id+')">Удалить</button></div>';
      }).join("");
    }
  });
  $("topics-list").innerHTML = html;
}

  modal.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.85);z-index:9999;overflow-y:auto;padding:70px 14px 30px 14px;-webkit-overflow-scrolling:touch";
  var imgsHtml = (c.images||[]).map(function(src){ return '<img src="'+esc(src)+'" style="max-width:100%;border-radius:6px;margin:10px 0;display:block">'; }).join('');
  var noteHtml = c.note ? '<div style="background:#fffbeb;border-left:4px solid #f59e0b;padding:10px;border-radius:6px;margin:10px 0;white-space:pre-wrap"><b>📝 Заметка:</b>\n'+esc(c.note)+'</div>' : '';
  modal.innerHTML =
    '<button id="modal-close" style="position:fixed;top:12px;right:12px;background:#ef4444;color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:1.5rem;cursor:pointer;z-index:10000;box-shadow:0 3px 10px rgba(0,0,0,.4);line-height:1;padding:0">✕</button>'+
    '<div style="background:#fff;border-radius:12px;padding:18px;max-width:640px;margin:0 auto;color:#0f172a">'+
      '<h3 style="margin:0 0 10px">'+esc(c.question)+'</h3>'+imgsHtml+noteHtml+
      '<h4 style="margin:14px 0 6px;color:#10b981">ПЛАН</h4>'+
      '<pre style="white-space:pre-wrap;font-family:inherit;background:#f0fdf4;padding:12px;border-radius:6px;font-size:.9rem;margin:0">'+esc(c.plan)+'</pre>'+
      '<h4 style="margin:14px 0 6px;color:#3b82f6">ОТВЕТ</h4>'+
      '<div style="background:#f8fafc;padding:12px;border-radius:6px;font-size:.9rem;white-space:pre-wrap">'+esc(c.answer)+'</div>'+
      '<div style="margin-top:20px;text-align:center"><button id="modal-close-2" style="background:#3b82f6;color:#fff;border:none;padding:14px 40px;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:600">Закрыть</button></div>'+
    '</div>';
  document.body.appendChild(modal);
  document.getElementById("modal-close").onclick = function(){modal.remove();};
  document.getElementById("modal-close-2").onclick = function(){modal.remove();};
  modal.onclick = function(e){if(e.target===modal) modal.remove();};
};

$("export-btn").onclick = function(){
  var cards = getCards();
  var qs = getQuestions();
  if(!cards.length && !Object.keys(qs).length){alert("Нет данных");return;}
  var data = {subject: currentSubject, questions: qs, cards: cards};
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var d = new Date();
  var safeName = currentSubject.replace(/[^\wа-яёА-ЯЁ\s-]/gi, '').trim().replace(/\s+/g,'_');
  a.href = url; a.download = safeName + "-" + d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate() + ".json"; a.click();
  URL.revokeObjectURL(url);
};

$("import-json").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    try{
      var data = JSON.parse(ev.target.result);
      var importedCards = Array.isArray(data) ? data : (data.cards || []);
      var importedSubject = data.subject || null;
      var importedQuestions = data.questions || null;
      if(!Array.isArray(importedCards)) throw new Error("Не массив карточек");

      if(importedSubject && importedSubject !== currentSubject){
        var choice = confirm("Файл из предмета «"+importedSubject+"».\n\nOK — создать/переключиться в этот предмет.\nОтмена — загрузить в текущий предмет «"+currentSubject+"».");
        if(choice){
          if(!subjects[importedSubject]) subjects[importedSubject] = { questions: {}, cards: [] };
          currentSubject = importedSubject;
        }
      }

      // Добавляем вопросы, если их ещё нет
      if(importedQuestions){
        var qs = getQuestions();
        Object.keys(importedQuestions).forEach(function(k){
          if(!qs[k]) qs[k] = importedQuestions[k];
        });
      }

      var cards = getCards();
      var added = 0, skipped = 0;
      importedCards.forEach(function(d){
        if(!d.question || !d.answer){skipped++;return;}
        if(cards.some(function(c){return c.question === d.question && (c.num||"") === (d.num||"");})){skipped++;return;}
        cards.push({
          id:Date.now()+Math.random(), num:d.num||"", group:d.group||"",
          question:d.question, answer:d.answer, plan:d.plan||autoPlan(d.answer),
          images:d.images || (d.image ? [d.image] : []),
          note:d.note||"", favorite:d.favorite||false, postponedUntil:d.postponedUntil||0,
          learned:d.learned||false, due:d.due||Date.now(), reps:d.reps||0, interval:d.interval||0, ease:d.ease||2.5
        });
        added++;
      });
      save(); renderSubjectSelect(); renderTopics(); renderStudyStart(); renderSummary();
      alert("Добавлено карточек: "+added+"\nПропущено: "+skipped);
    }catch(err){alert("Ошибка: "+err.message);}
    e.target.value = "";
  };
  r.readAsText(f, "UTF-8");
});

$("clear-all").onclick = function(){
  if(!confirm("Удалить ВСЕ карточки в предмете «"+currentSubject+"»? Вопросы останутся.")) return;
  setCards([]); save(); renderTopics();
};

/* ============ УЧЁБА ============ */
function renderStudyStart(){
  var area = $("study-area");
  var cards = getCards();
  if(!cards.length){area.innerHTML = "<p>В этом предмете пока нет карточек.</p>"; return;}
  var left = cards.filter(function(c){return !c.learned;}).length;
  var groups = {};
  cards.forEach(function(c){ groups[c.group || "—"] = true; });
  var totalGroups = Object.keys(groups).length;
  var favCount = cards.filter(function(c){return c.favorite;}).length;
  var postCount = cards.filter(function(c){return c.postponedUntil && c.postponedUntil > Date.now();}).length;

  area.innerHTML =
    '<p style="margin:0 0 14px">Предмет: <b>'+esc(currentSubject)+'</b><br>Всего: '+cards.length+'. Осталось изучить: '+left+'.<br>Тем: '+totalGroups+'. Избранных: '+favCount+'. Отложенных: '+postCount+'.</p>'+
    '<h4 style="margin:14px 0 8px">По карточкам</h4>'+
    '<div class="row">'+
      '<button class="btn" id="start-all">Все подряд</button>'+
      '<button class="btn ghost" id="start-left">Только неизученные</button>'+
      '<button class="btn warn" id="start-fav">⭐ Избранные</button>'+
      '<button class="btn ghost" id="start-post">⏰ Отложенные</button>'+
    '</div>'+
    '<h4 style="margin:22px 0 8px">По темам целиком</h4>'+
    '<div class="row">'+
      '<button class="btn ok" id="start-topic-all">Все темы</button>'+
      '<button class="btn ghost" id="start-topic-left">Только неизученные</button>'+
    '</div>';

  $("start-all").onclick = function(){studyQueue = getCards().slice(); studyMode="cards"; nextCard();};
  $("start-left").onclick = function(){ studyQueue = getCards().filter(function(c){return !c.learned;}); if(!studyQueue.length){alert("Все изучено!");return;} studyMode="cards"; nextCard(); };
  $("start-fav").onclick = function(){ studyQueue = getCards().filter(function(c){return c.favorite;}); if(!studyQueue.length){alert("Нет избранных.");return;} studyMode="cards"; nextCard(); };
  $("start-post").onclick = function(){ studyQueue = getCards().filter(function(c){return c.postponedUntil && c.postponedUntil > Date.now();}); if(!studyQueue.length){alert("Нет отложенных.");return;} studyMode="cards"; nextCard(); };
  $("start-topic-all").onclick = function(){ studyQueue = buildTopicQueue(false); studyMode="topics"; nextTopic(); };
  $("start-topic-left").onclick = function(){ studyQueue = buildTopicQueue(true); if(!studyQueue.length){alert("Все темы изучены!");return;} studyMode="topics"; nextTopic(); };
}

function buildTopicQueue(onlyUnlearned){
  var cards = getCards();
  var qs = getQuestions();
  var groups = {};
  cards.forEach(function(c){
    var g = c.group || "—";
    if(!groups[g]) groups[g] = [];
    groups[g].push(c);
  });
  var list = [];
  Object.keys(groups).sort(function(a,b){
    var na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  }).forEach(function(g){
    var gCards = groups[g];
    var allLearned = gCards.every(function(c){return c.learned;});
    if(onlyUnlearned && allLearned) return;
    list.push({group: g, title: qs[g] || ("Тема " + g), cards: gCards});
  });
  return list;
}

function nextCard(){
  var area = $("study-area");
  if(!studyQueue.length){area.innerHTML = "<p>✅ Готово!</p>"; return;}
  cur = studyQueue.shift();
  var imgsHtml = (cur.images||[]).map(function(src){ return '<img class="card-img" src="'+esc(src)+'">'; }).join('');
  var noteHtml = cur.note ? '<div style="background:#fffbeb;border-left:4px solid #f59e0b;padding:10px;border-radius:6px;margin:10px 0;font-size:.88rem;white-space:pre-wrap"><b>📝 Заметка:</b>\n'+esc(cur.note)+'</div>' : '';
  var learnedTag = cur.learned ? ' <span class="pill" style="background:#d1fae5;color:#065f46">Изучено</span>' : '';
  var isPost = cur.postponedUntil && cur.postponedUntil > Date.now();
  var postTag = isPost ? ' <span class="pill" style="background:#fed7aa;color:#7c2d12">⏰</span>' : '';
  var favTag = cur.favorite ? ' <span class="pill" style="background:#fef3c7;color:#92400e">⭐</span>' : '';

  area.innerHTML = '<h3>Вопрос'+learnedTag+postTag+favTag+'</h3><p><strong>'+esc(cur.question)+'</strong></p>'+imgsHtml+noteHtml+
    '<label>Ответ:</label><textarea id="recall" class="big"></textarea>'+
    '<button class="btn" id="reveal" style="margin-top:10px">Показать план</button>'+
    '<div id="ans" style="display:none">'+
      '<div class="answer plan"><b>План:</b>\n'+esc(cur.plan)+'</div>'+
      '<details><summary style="cursor:pointer">Полный текст</summary><div class="answer">'+esc(cur.answer)+'</div></details>'+
      '<p>Насколько легко?</p>'+
      '<div class="rating"><button data-q="0">Снова</button><button data-q="1">Трудно</button><button data-q="2">Норм</button><button data-q="3">Легко</button></div>'+
      '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">'+
        '<button class="btn ghost mini" id="toggle-learn">'+(cur.learned?'Снять отметку':'✓ Изучено')+'</button>'+
        '<button class="btn ghost mini" id="toggle-fav">'+(cur.favorite?'Убрать ⭐':'⭐ В избранное')+'</button>'+
        '<button class="btn ghost mini" id="postpone-btn">⏰ Отложить на 3 дня</button>'+
        '<button class="btn ghost mini" id="edit-note-btn">✎ Заметка</button>'+
      '</div>'+
    '</div>';

  $("reveal").onclick = function(){$("ans").style.display="block";$("reveal").style.display="none";};
  $("toggle-learn").onclick = function(){cur.learned = !cur.learned; save(); nextCard();};
  $("toggle-fav").onclick = function(){cur.favorite = !cur.favorite; save(); nextCard();};
  $("postpone-btn").onclick = function(){ cur.postponedUntil = Date.now() + 3*86400000; save(); alert("Отложено на 3 дня"); nextCard(); };
  $("edit-note-btn").onclick = function(){ editNote(cur.id); };
  document.querySelectorAll(".rating button").forEach(function(b){b.onclick=function(){rateCard(parseInt(b.dataset.q));};});
}

function rateCard(q){
  var now = Date.now();
  if(q >= 2) cur.learned = true;
  if(q===0){cur.reps=0;cur.interval=0;cur.due=now+10*60*1000;}
  else{
    if(cur.reps===0) cur.interval = q===1?1:q===2?1:3;
    else if(cur.reps===1) cur.interval = q===1?3:q===2?6:10;
    else cur.interval = Math.round(cur.interval*cur.ease);
    cur.reps++; cur.due = now + cur.interval*86400000;
  }
  save(); nextCard();
}

function nextTopic(){
  var area = $("study-area");
  if(!studyQueue.length){area.innerHTML = '<p>✅ Все темы пройдены.</p>'; return;}
  curTopic = studyQueue.shift();
  var g = curTopic.group, title = curTopic.title, gCards = curTopic.cards;
  area.innerHTML =
    '<div style="font-size:.75rem;color:#64748b;font-weight:600;text-transform:uppercase">Вопрос '+g+'</div>'+
    '<h3 style="margin:4px 0 12px">'+esc(title)+'</h3>'+
    '<p class="hint">'+gCards.length+' подтем. Постарайся вспомнить всё.</p>'+
    '<label>Твой ответ:</label>'+
    '<textarea id="recall" class="big"></textarea>'+
    '<button class="btn" id="reveal" style="margin-top:10px">Показать эталон</button>'+
    '<div id="ans" style="display:none">'+
      '<h4 style="margin:16px 0 8px;color:#10b981">План (по подтемам)</h4>'+
      gCards.map(function(c){
        var noteIn = c.note ? '<div style="background:#fffbeb;border-left:3px solid #f59e0b;padding:8px;border-radius:6px;margin-top:8px;font-size:.82rem;white-space:pre-wrap"><b>📝</b> '+esc(c.note)+'</div>' : '';
        return '<div class="topic-part"><div class="pt">'+esc(c.question)+'</div><pre style="white-space:pre-wrap;font-family:inherit;font-size:.85rem;margin:0">'+esc(c.plan)+'</pre>'+noteIn+'</div>';
      }).join('')+
      '<h4 style="margin:16px 0 8px;color:#3b82f6">Полный ответ</h4>'+
      gCards.map(function(c){
        return '<div class="topic-answer"><b>'+esc(c.question)+'</b>\n\n'+esc(c.answer)+'</div>';
      }).join('')+
      '<p style="margin-top:16px">Оцени ответ по всей теме:</p>'+
      '<div class="rating"><button data-q="0">Снова</button><button data-q="1">Трудно</button><button data-q="2">Норм</button><button data-q="3">Легко</button></div>'+
    '</div>';
  $("reveal").onclick = function(){$("ans").style.display="block";$("reveal").style.display="none";};
  document.querySelectorAll(".rating button").forEach(function(b){b.onclick = function(){rateTopic(parseInt(b.dataset.q));};});
}

function rateTopic(q){
  var now = Date.now();
  curTopic.cards.forEach(function(c){
    if(q >= 2) c.learned = true;
    if(q === 0){c.reps = 0; c.interval = 0; c.due = now + 10*60*1000;}
    else {
      if(c.reps === 0) c.interval = q===1?1:q===2?1:3;
      else if(c.reps === 1) c.interval = q===1?3:q===2?6:10;
      else c.interval = Math.round(c.interval * c.ease);
      c.reps++; c.due = now + c.interval*86400000;
    }
  });
  save(); nextTopic();
}

/* ============ СВОДКА ============ */
function renderSummary(){
  var cards = getCards();
  var qs = getQuestions();
  var totalCards = cards.length;
  var learnedCards = cards.filter(function(c){return c.learned;}).length;
  var pct = totalCards ? Math.round(learnedCards/totalCards*100) : 0;
  $("overall-progress").innerHTML = '<div class="big-pbar"><div style="width:'+pct+'%"></div><span>'+esc(currentSubject)+': '+learnedCards+' из '+totalCards+' · '+pct+'%</span></div>';

  // Строим сводку из вопросов предмета + реальных групп карточек
  var allGroups = {};
  Object.keys(qs).forEach(function(g){ allGroups[g] = true; });
  cards.forEach(function(c){ if(c.group) allGroups[c.group] = true; });

  if(!Object.keys(allGroups).length){
    $("summary-list").innerHTML = '<p class="hint">В этом предмете пока нет ни вопросов, ни карточек.</p>';
    return;
  }

  var html = "";
  Object.keys(allGroups).sort(function(a,b){
    var na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  }).forEach(function(g){
    var group = cards.filter(function(c){return c.group === g;});
    var gTotal = group.length;
    var gLearned = group.filter(function(c){return c.learned;}).length;
    var status = "none", icon = "○", cls = "sum-item none";
    if(gTotal > 0 && gLearned === gTotal){status="full";icon="✓";cls="sum-item full";}
    else if(gLearned > 0){status="part";icon="◐";cls="sum-item part";}
    if(summaryFilter === "learned" && status !== "full") return;
    if(summaryFilter === "left" && status === "full") return;

    var title = qs[g] || (gTotal ? group[0].question : "Вопрос " + g);
    html += '<div class="'+cls+'">';
    html += '<div class="sum-num">'+g+'.</div>';
    html += '<div class="sum-body">';
    html += '<p class="sum-q">'+esc(title)+'</p>';
    if(gTotal === 0){
      html += '<p class="sum-meta">карточек нет</p>';
    } else {
      html += '<p class="sum-meta">'+gLearned+'/'+gTotal+' подтем'+(gLearned === gTotal ? ' · готово' : '')+'</p>';
    }
    html += '</div>';
    html += '<div class="sum-status">'+icon+'</div>';
    html += '</div>';
  });

  $("summary-list").innerHTML = html || '<p class="hint">Ничего не найдено.</p>';
}

$("filter-all").onclick = function(){summaryFilter="all"; renderSummary();};
$("filter-learned").onclick = function(){summaryFilter="learned"; renderSummary();};
$("filter-left").onclick = function(){summaryFilter="left"; renderSummary();};

/* ============ СТАРТ ============ */
renderSubjectSelect();
renderTopics();
</script>
